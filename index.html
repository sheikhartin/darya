<!DOCTYPE html>
<html lang="fa" dir="rtl" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d2b33" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#cfe7ec" media="(prefers-color-scheme: light)">
  <title id="page-title">دریا · همراه گفتگوی آرام</title>
  <meta id="page-description" name="description" content="دریا، همراه گفتگوی فارسی‌زبان برای گوش دادن و همراهی.">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- iOS doesn't support the web app manifest for "add to home screen"
       behavior, so these Apple-specific tags cover the same ground:
       standalone (no browser chrome) and a matching status bar style. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Darya">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Persian: Vazirmatn (body) + Lalezar (display wordmark only).
       English: Be Vietnam Pro (body, warm and rounded) + Quicksand (display wordmark only). -->
  <!-- All fonts are self-hosted in fonts/ (see css/style.css @font-face
       rules) for full offline capability -- no CDN dependency. -->
  <link rel="preload" href="fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BeVietnamPro-Regular.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient backdrop. Ocean theme: soft light glows, a faint horizon
       silhouette, and randomly-placed rising bubbles (populated by
       app.js, so each one gets a genuinely random size/position/timing
       rather than a repeating formula). Beach theme: a proper shoreline
       scene (sea strip, scalloped foam edge, tall sand band) plus
       drifting wind gusts and subtle bird-shadow silhouettes drifting
       across the sky. Both themes' elements live here; CSS shows only
       the active theme's set. -->
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__glow backdrop__glow--one"></div>
    <div class="backdrop__glow backdrop__glow--two"></div>
    <div class="backdrop__depth-breath" aria-hidden="true"></div>

    <svg class="backdrop__horizon" viewBox="0 0 1200 300" preserveAspectRatio="none">
      <path d="M0,150 C200,90 400,210 600,150 C800,90 1000,210 1200,150 L1200,300 L0,300 Z" fill="#7fbeb0"/>
    </svg>

    <div class="beach-scene">
      <div class="beach-scene__sky"></div>
      <div class="beach-scene__sun" aria-hidden="true">
        <div class="beach-scene__sun-halo"></div>
        <div class="beach-scene__sun-core"></div>
      </div>
      <div class="beach-scene__ocean beach-scene__ocean--far"></div>
      <div class="beach-scene__ocean beach-scene__ocean--mid"></div>
      <div class="beach-scene__ocean beach-scene__ocean--near"></div>
      <div class="beach-scene__foam"></div>
      <div class="beach-scene__sand"></div>
      <div class="beach-scene__wet-patches"></div>
      <div class="bird-shadows"></div>
    </div>

    <div class="backdrop__scrim"></div>

    <div class="bubbles"></div>
    <div class="wind-gusts"></div>
  </div>

  <!-- Language picker: shown before any conversation starts, and again
       whenever "New chat" is chosen, since the language is locked for
       the duration of a conversation and can only change at a fresh
       start. Each half is self-contained with its own dir/lang so both
       languages are presented on equal footing. -->
  <div class="picker" id="picker">
    <div class="picker__inner">
      <div class="picker__intro">
        <span class="picker__intro-fa" lang="fa" dir="rtl">با دریا آشنا شوید</span>
        <span class="picker__intro-sep">·</span>
        <span class="picker__intro-en" lang="en" dir="ltr">Meet Darya</span>
      </div>

      <div class="picker__options">
        <button class="picker__option" id="picker-fa" type="button" lang="fa" dir="rtl" title="شروع گفتگو به زبان فارسی">
          <span class="picker__option-title">فارسی</span>
          <span class="picker__option-desc">شروع گفتگو به زبان فارسی</span>
        </button>
        <button class="picker__option" id="picker-en" type="button" lang="en" dir="ltr" title="Start the conversation in English">
          <span class="picker__option-title">English</span>
          <span class="picker__option-desc">Start the conversation in English</span>
        </button>
      </div>

      <div class="theme-picker" id="theme-picker" role="group" aria-label="Theme / پوسته">
        <button class="theme-picker__option" type="button" data-theme-choice="ocean" aria-pressed="true" title="انتخاب پوسته اقیانوس / Choose the ocean theme">
          <span class="theme-picker__icon" aria-hidden="true">🌊</span>
          <span class="theme-picker__label">
            <span lang="fa" dir="rtl">اقیانوس</span><span class="theme-picker__sep">·</span><span lang="en" dir="ltr">Ocean</span>
          </span>
        </button>
        <button class="theme-picker__option" type="button" data-theme-choice="beach" aria-pressed="false" title="انتخاب پوسته ساحل / Choose the beach theme">
          <span class="theme-picker__icon" aria-hidden="true">🏖️</span>
          <span class="theme-picker__label">
            <span lang="fa" dir="rtl">ساحل</span><span class="theme-picker__sep">·</span><span lang="en" dir="ltr">Beach</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <div class="app" id="app" hidden>

    <header class="header">
      <span class="header__title" id="header-title">دریا</span>

      <div class="menu">
        <button id="menu-trigger" class="menu__trigger" type="button" aria-haspopup="true" aria-controls="menu-popover" aria-expanded="false" aria-label="باز کردن منوی گزینه‌های گفتگو" title="باز کردن منوی گزینه‌های گفتگو">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="5" cy="12" r="1.8" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
            <circle cx="19" cy="12" r="1.8" fill="currentColor"/>
          </svg>
        </button>

        <div id="menu-popover" class="menu__popover" role="menu" hidden>
          <button id="menu-new-chat" class="menu__item" type="button" role="menuitem" title="شروع گفتگوی تازه">
            <span class="menu__item-icon" aria-hidden="true">↺</span>
            <span id="menu-new-chat-label">گفتگوی تازه</span>
          </button>
          <div class="menu__divider" role="separator"></div>
          <button id="menu-export-txt" class="menu__item" type="button" role="menuitem" aria-label="دانلود گفتگوی متن ساده" title="دانلود گفتگوی متن ساده">
            <svg class="menu__item-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="menu-export-txt-label">دانلود گفتگوی متن ساده</span>
          </button>
          <button id="menu-export-md" class="menu__item" type="button" role="menuitem" aria-label="دانلود گفتگوی مارک‌داون" title="دانلود گفتگوی مارک‌داون">
            <svg class="menu__item-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="menu-export-md-label">دانلود گفتگوی مارک‌داون</span>
          </button>
          <div class="menu__divider" role="separator"></div>
          <button id="menu-theme-toggle" class="menu__item" type="button" role="menuitem" title="تغییر پوسته گفتگو">
            <span class="menu__item-icon" id="menu-theme-icon" aria-hidden="true">🏖️</span>
            <span id="menu-theme-label">پوسته ساحل</span>
          </button>
          <div class="menu__divider" role="separator"></div>
          <p class="menu__note" id="menu-language-note">
            <span lang="fa" dir="rtl">زبان فقط تا شروع گفتگوی بعدی تغییرپذیر است.</span>
            <span lang="en" dir="ltr">Language locks once your conversation begins.</span>
          </p>
        </div>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite">
      <!-- Messages are injected here by app.js -->
    </main>

    <div class="typing-row" id="typing-row" role="status" aria-live="polite" aria-label="دریا در حال فکر کردن است" hidden>
      <div class="bubble bubble--bot bubble--typing">
        <span class="ripple-dot"></span>
        <span class="ripple-dot"></span>
        <span class="ripple-dot"></span>
      </div>
    </div>

    <p class="input-hint" id="input-hint" role="alert" hidden></p>

    <form class="composer" id="composer" autocomplete="off">
      <textarea
        id="composer-input"
        class="composer__input"
        rows="1"
        maxlength="4000"
      ></textarea>
      <button type="submit" id="composer-send" class="composer__send" aria-label="ارسال پیام به دریا" title="ارسال پیام فعلی" disabled>
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M4 12l16-7-6 16-2.5-6.5L4 12z" fill="currentColor"/>
        </svg>
      </button>
    </form>

    <p class="disclaimer" id="disclaimer-text">
      دریا یک همراه شنونده است، نه جایگزین کمک تخصصی. در شرایط بحرانی، لطفاً با یک متخصص یا خط بحران تماس بگیرید.
    </p>
  </div>

  <script src="js/knowledge-base.js"></script>
  <script src="js/languages/halfspace.js"></script>
  <script src="js/languages/entity-extractor.js"></script>
  <script src="js/languages/fa.js"></script>
  <script src="js/languages/en.js"></script>
  <script src="js/darya-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
