name: Build Android Release on Tag

# Builds a signed release AAB (Google Play) and a signed release APK
# (Iranian stores such as Cafe Bazaar and Myket) from the web bundle, and
# attaches both to the GitHub Release for every pushed version tag (tags
# in this repo are bare versions like 1.2.3, no "v" prefix).
#
# The android/ platform folder is committed, so the workflow syncs the
# web bundle into it with `cap sync` rather than regenerating the
# platform. The signing keystore is decoded from the
# ANDROID_KEYSTORE_BASE64 repository secret; the other three secrets
# (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)
# are exported to the Gradle build through environment variables.
#
# The signing secrets are mapped into job-level env variables because
# the `secrets` context cannot be referenced directly in `if:`
# conditions (GitHub Actions limitation).
#
# The pinned action majors are the current releases (checkout@v7,
# setup-node@v7, setup-java@v5, upload-artifact@v7). The older v4
# majors ran on the deprecated Node 20 action runtime, whose support
# cutoff passed on June 2, 2026.
#
# Manual runs (workflow_dispatch) build a debug APK unless the secrets
# are configured, and never attach anything to a release.

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Must stay in sync with "engines.node" in package.json
          # (>=22). Capacitor 8's CLI requires Node 22+.
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run the full CI gate
        # The repo's own release gate (lint, CSS lint, format check, and
        # the 1076-test suite). Store builds are long-lived, so an
        # engine regression must never ship inside an APK; ~30s here is
        # cheap next to the multi-minute Gradle build.
        run: npm run test:full

      - name: Sync web assets into www/ and the Android project
        run: |
          npm run sync:web
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Required by Capacitor 8 and AGP 8.13 (this project pins
          # com.android.tools.build:gradle:8.13.0).
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Fail early if release signing secrets are missing (tag runs)
        if: ${{ startsWith(github.ref, 'refs/tags/') && (env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_ALIAS == '' || env.KEY_PASSWORD == '') }}
        run: |
          echo "::error::Release signing secrets are not configured or incomplete. Add all four repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see the README's Android APK Builds section)."
          exit 1

      - name: Decode the release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/darya-release.jks

      - name: Stamp the app version from the git tag
        # The committed build.gradle ships versionCode 123 / versionName
        # "1.2.3"; make the build report the tagged version (1.2.3 ->
        # versionName "1.2.3", versionCode 123) so releases are
        # self-describing and versionCode keeps increasing across tags.
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERCODE="$(printf '%s' "${TAG}" | tr -cd '0-9')"
          VERCODE="${VERCODE:-1}"
          # Anchor to line starts so comments mentioning the version are
          # never rewritten, only the real versionCode/versionName lines.
          sed -i -E \
            -e "s/^([[:space:]]*)versionCode [0-9]+/\1versionCode ${VERCODE}/" \
            -e "s/^([[:space:]]*)versionName \".*\"/\1versionName \"${TAG}\"/" \
            android/app/build.gradle

      - name: Build signed release AAB and APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/darya-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Build debug APK (no keystore configured)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename release artifacts with the version tag
        # Gradle names the outputs after the app module (app-release.apk,
        # app-release.aab), so without a rename every release would ship
        # identically named assets and a new download would overwrite an
        # older version's file. Copy them under tag-qualified names (e.g.
        # Darya-1.2.3-release.apk) for the GitHub Release instead.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "android/app/build/outputs/bundle/release/Darya-${TAG}-release.aab"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/Darya-${TAG}-release.apk"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: darya-build
          if-no-files-found: ignore
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach release artifacts to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/bundle/release/Darya-${{ github.ref_name }}-release.aab
            android/app/build/outputs/apk/release/Darya-${{ github.ref_name }}-release.apk
          fail_on_unmatched_files: true
